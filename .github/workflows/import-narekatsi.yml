name: Import Narekatsi Gandzer and Tagher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-narekatsi.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: narekatsi-gandzer-tagher-2026-11-14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download typed Grabar text from Digilib
        run: |
          python scripts/fetch-digilib.py 3052 "Գանձեր եւ Տաղեր — Գրիգոր Նարեկացի" "books/grabar/grigor-narekatsi/2-gandzer-tagher"
      - name: Add source note
        run: |
          cat > books/grabar/grigor-narekatsi/2-gandzer-tagher/SOURCE.md <<'EOF'
          # Source

          - Digital library: Digilib (American University of Armenia)
          - Collection: Գանձեր եւ Տաղեր
          - Digilib book ID: 3052
          - Source URL: https://www.digilib.am/book/3052/
          - Downloaded as typed Grabar text by scripts/fetch-digilib.py.

          Digilib attributes this collection to Գրիգոր Նարեկացի. This records the source's attribution; it is not an independent scholarly authentication of every individual text in the collection.
          EOF
      - name: Commit imported text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/grabar/grigor-narekatsi/2-gandzer-tagher
          git diff --cached --quiet && exit 0
          git commit -m "Add Narekatsi Gandzer and Tagher from Digilib"
          git push origin HEAD:narekatsi-gandzer-tagher-2026-11-14
